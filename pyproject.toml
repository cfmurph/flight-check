[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-flight-scanner"
version = "1.0.0"
description = "Scans and reports the best deals on domestic flights within Canada"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "amadeus>=9.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "click>=8.1.8",
    "rich>=13.9.4",
    "schedule>=1.2.2",
]

[project.scripts]
canada-flights = "canada_flight_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
